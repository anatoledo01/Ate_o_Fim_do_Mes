<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17182B" />
      <stop offset="100%" stop-color="#23253F" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#B9F5C8" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(196, 181, 253, 0.2)" stroke-width="4" />
  
  <!-- Stylized calendar page & crescent progress -->
  <g transform="translate(96, 96)">
    <!-- Calendar base -->
    <rect x="24" y="48" width="272" height="248" rx="36" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#accentGrad)" stroke-width="12" />
    
    <!-- Top banner -->
    <path d="M24 84 C24 64, 40 48, 60 48 L260 48 C280 48, 296 64, 296 84 L296 112 L24 112 Z" fill="#C4B5FD" fill-opacity="0.25" />
    
    <!-- Rings -->
    <rect x="80" y="24" width="16" height="48" rx="8" fill="#B9F5C8" />
    <rect x="224" y="24" width="16" height="48" rx="8" fill="#B9F5C8" />
    
    <!-- Central Daily Balance Symbol: Coin / Rising line / Sparkle -->
    <circle cx="160" cy="200" r="54" fill="none" stroke="#B9F5C8" stroke-width="14" stroke-dasharray="260" stroke-dashoffset="60" stroke-linecap="round" />
    <circle cx="160" cy="200" r="26" fill="#C4B5FD" />
    <path d="M120 220 L150 185 L175 205 L205 165" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
